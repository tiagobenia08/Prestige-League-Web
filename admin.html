<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prestige League — Admin</title><link rel="icon" href="assets/prestige-logo.png"><link rel="stylesheet" href="styles.css"><style>
body{min-height:100vh;background:#090a0c;color:#eee;font-family:Inter,Arial,sans-serif}.admin-wrap{max-width:1200px;margin:0 auto;padding:36px 22px}.admin-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2d31;padding-bottom:20px;margin-bottom:28px}.admin-brand{display:flex;align-items:center;gap:14px}.admin-brand img{width:58px;height:58px;object-fit:contain}.admin-brand h1{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:1px;margin:0;font-size:34px}.admin-brand span{display:block;color:#f06b21;font-size:12px;font-weight:800;letter-spacing:1px}.admin-card{background:#111317;border:1px solid #2b2e33;padding:24px;margin-bottom:22px}.admin-card h2{font-family:'Barlow Condensed';font-size:26px;margin:0 0 16px;text-transform:uppercase}.login{max-width:480px;margin:12vh auto}.input{width:100%;box-sizing:border-box;background:#08090b;color:white;border:1px solid #3a3d42;padding:13px;margin:8px 0 14px}.btn{cursor:pointer}.msg{margin-top:12px;color:#f06b21}.hidden{display:none!important}.table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse;min-width:850px}.admin-table th,.admin-table td{border-bottom:1px solid #292c30;padding:12px 9px;text-align:left;vertical-align:top}.admin-table th{font-family:'Barlow Condensed';text-transform:uppercase;color:#f06b21}.status{padding:4px 7px;border:1px solid #444;font-size:11px}.actions button{margin:3px 4px 3px 0;padding:7px 9px;border:1px solid #444;background:#191b1f;color:#fff;cursor:pointer}.actions .ok{border-color:#f06b21}.chatbox{max-height:500px;overflow:auto;border:1px solid #292c30;padding:12px}.chatline{padding:10px;border-bottom:1px solid #24272b}.chatline b{color:#f06b21}.chatform{display:flex;gap:10px;margin-top:12px}.chatform input{flex:1}.small{color:#9b9da2;font-size:12px}
</style></head><body><div id="login" class="admin-wrap login"><div class="admin-card"><div class="admin-brand"><img src="assets/prestige-logo.png"><div><span>PRESTIGE LEAGUE</span><h1>Panel Admin</h1></div></div><p class="small">Ingresá con la contraseña configurada en Railway como <b>ADMIN_PASSWORD</b>.</p><input id="password" class="input" type="password" placeholder="Contraseña"><button class="btn btn-primary" onclick="login()">ENTRAR</button><div id="loginMsg" class="msg"></div></div></div>
<div id="panel" class="admin-wrap hidden"><div class="admin-top"><div class="admin-brand"><img src="assets/prestige-logo.png"><div><span>PRESTIGE LEAGUE</span><h1>Panel de Administración</h1></div></div><button class="btn btn-ghost" onclick="logout()">CERRAR SESIÓN</button></div><div class="admin-card"><h2>Inscripciones</h2><div id="regMsg" class="small">Cargando...</div><div class="table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th>Equipo</th><th>País</th><th>Capitán</th><th>Jugadores</th><th>Pago</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="regs"></tbody></table></div></div><div class="admin-card"><h2>Mensajes al Staff</h2><div id="chat" class="chatbox"></div><form class="chatform" onsubmit="sendStaff(event)"><input id="staffMsg" class="input" style="margin:0" maxlength="1000" placeholder="Responder al usuario..."><button class="btn btn-primary">ENVIAR</button></form></div></div>
<script>let pw=sessionStorage.getItem('pl_admin_pw')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function api(url,opt={}){opt.headers=Object.assign({},opt.headers||{}, {'x-admin-password':pw,'Content-Type':'application/json'});let r=await fetch(url,opt);let d=await r.json().catch(()=>({}));if(r.status===401)throw Error('Contraseña incorrecta');if(!r.ok)throw Error(d.error||'Error');return d}async function login(){pw=document.getElementById('password').value;try{await api('/api/admin/registrations');sessionStorage.setItem('pl_admin_pw',pw);show();load()}catch(e){document.getElementById('loginMsg').textContent=e.message}}function show(){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden')}function logout(){sessionStorage.removeItem('pl_admin_pw');pw='';location.reload()}async function load(){try{let r=await api('/api/admin/registrations');document.getElementById('regMsg').textContent=r.length+' inscripción(es)';document.getElementById('regs').innerHTML=r.map(x=>`<tr><td>#${x.id}</td><td><b>${esc(x.team_name)}</b></td><td>${esc(x.country)}</td><td>${esc(x.captain_contact)}</td><td>${(x.players||[]).map(esc).join('<br>')}</td><td>${esc(x.payment_reference)}<br><span class="status">${esc(x.payment_status)}</span></td><td><span class="status">${esc(x.status)}</span></td><td class="actions"><button class="ok" onclick="updateReg(${x.id},'approved','verified')">APROBAR</button><button onclick="updateReg(${x.id},'rejected','rejected')">RECHAZAR</button><button onclick="updateReg(${x.id},'pending_review','pending')">PENDIENTE</button></td></tr>`).join('');let c=await api('/api/admin/chat');document.getElementById('chat').innerHTML=c.map(x=>`<div class="chatline"><b>${esc(x.sender_name)}</b> <span class="small">${new Date(x.created_at).toLocaleString()}</span><div>${esc(x.message)}</div></div>`).join('')||'<div class="small">No hay mensajes.</div>'}catch(e){if(e.message.includes('Contraseña'))logout();else document.getElementById('regMsg').textContent=e.message}}async function updateReg(id,status,payment_status){try{await api('/api/admin/registrations/'+id,{method:'PATCH',body:JSON.stringify({status,payment_status})});load()}catch(e){alert(e.message)}}async function sendStaff(e){e.preventDefault();let m=document.getElementById('staffMsg').value.trim();if(!m)return;try{await api('/api/admin/chat',{method:'POST',body:JSON.stringify({message:m,name:'Prestige League Staff'})});document.getElementById('staffMsg').value='';load()}catch(e){alert(e.message)}}if(pw)login();</script></body></html>
